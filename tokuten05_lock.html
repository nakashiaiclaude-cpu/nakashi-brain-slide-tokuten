<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読了後も自分で育てる資産化ワークシート｜特典⑤（レビュー特典）</title>
<style>/* fontbump-v1 */
  :root{
    --navy:#1a2233;
    --orange:#e8772e;
    --teal:#2f7a8a;
    --teal-soft:#eaf3f4;
    --cream:#fdf0d9;
    --bg:#fbf9f5;
    --line:#ece4d6;
    --muted:#6b6f7d;
    --shadow:0 10px 36px rgba(26,34,51,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,system-ui,sans-serif;
    color:var(--navy);background:var(--bg);line-height:1.8;
  }
  .logo{position:fixed;top:14px;right:16px;z-index:50;height:28px;filter:drop-shadow(0 2px 6px rgba(26,34,51,.18))}
  .wrap{max-width:640px;margin:0 auto;padding:80px 18px 60px}
  .eyebrow{display:inline-block;font-size:14px;letter-spacing:.14em;color:var(--orange);font-weight:800;background:var(--cream);padding:6px 14px;border-radius:999px;margin-bottom:18px}
  h1{font-size:23px;line-height:1.5;margin:0 0 14px;color:var(--navy);font-weight:900;text-align:center}
  .lead{text-align:center;color:var(--muted);font-size:15.5px;margin:0 0 32px}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:28px 26px;box-shadow:var(--shadow);margin-bottom:20px;
  }
  .card h2{font-size:16.5px;margin:0 0 10px;color:var(--navy);font-weight:800}
  .card p{font-size:15px;color:var(--muted);margin:0}

  .steps{list-style:none;margin:0;padding:0;counter-reset:step}
  .steps li{
    counter-increment:step;position:relative;padding:0 0 18px 40px;font-size:15.5px;color:var(--navy);
  }
  .steps li:last-child{padding-bottom:0}
  .steps li::before{
    content:counter(step);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:8px;
    background:var(--teal);color:#fff;font-weight:800;font-size:14.5px;display:grid;place-items:center;
  }
  .steps li b{color:var(--orange)}

  .lineBtn{
    display:block;text-align:center;background:var(--orange);color:#fff;text-decoration:none;font-weight:800;
    font-size:16.5px;border-radius:999px;padding:15px 20px;box-shadow:0 6px 16px rgba(232,119,46,.3);margin-top:4px;
  }
  .lineBtn:hover{filter:brightness(1.05)}

  .noteBox{
    background:var(--cream);border:1px dashed #d8b06a;border-radius:14px;padding:16px 18px;font-size:14px;
    color:#7a5a16;line-height:1.8;
  }

  footer{text-align:center;font-size:13px;color:#9aa0ad;padding:40px 18px 20px}

  @media(max-width:560px){
    .wrap{padding:60px 14px 50px}
    h1{font-size:19px}
    .logo{height:22px;top:10px;right:10px}
    .card{padding:20px 18px}
  }
</style>
</head>
<body>
<img class="logo" src="assets/なかしー_ロゴ_透過.png" alt="なかしー｜ゼロから始めるClaude Code伴走">
<div class="wrap">
  <div style="text-align:center">
    <span class="eyebrow">特典⑤（レビュー特典）</span>
  </div>
  <h1>読了後も自分で育てる資産化ワークシート</h1>
  <p class="lead">ブランドガイド・構成ルール・依頼文テンプレの穴埋めテンプレ3点と、3ヶ月かけて自分の実務に育てるワークシートをお渡しします。</p>

  <div class="card">
    <h2>受け取り方</h2>
    <ol class="steps">
      <li>Brainでレビューを投稿する</li>
      <li>購入者限定LINEで、投稿した旨を<b>ひとことご連絡</b>する</li>
      <li>確認後、このページの受け取りリンクを個別にお送りします</li>
    </ol>
  </div>

  <a class="lineBtn" href="https://ogsvl3uc.autosns.app/line" target="_blank" rel="noopener">購入者限定LINEはこちら</a>

  <div style="height:20px"></div>

  <div class="noteBox">
    レビューは評価の内容を問いません。率直なご感想をいただければ十分です。ご連絡いただき次第、できるだけ早くお送りします。
  </div>
</div>

<footer>なかしー｜ゼロから始めるClaude Code伴走</footer>
</body>
</html>
